[project]
name = "vellum-lensed"
version = "0.1.0"
description = "Crafting tree browser for Star Citizen DataForge data"
readme = "README.md"
license = "MIT"
authors = [{name = "Joni Hayes"}]
requires-python = ">=3.12"
dependencies = [
    "pyqt6>=6.7",
    "forge-lens>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vellum_lensed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
